<div id="status"></div>
<input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>

<script type="module">
/* ─────────────────────────────────────────────────────────────────
   Leaf — a PDF reader that runs entirely in the browser.
   Nothing is uploaded anywhere; PDF.js decodes the file on-device.
   ───────────────────────────────────────────────────────────────── */

const PDFJS_VERSION = '4.10.38';
const CDN_BASES = [
  `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}`,
  `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VERSION}/build`,
  `https://unpkg.com/pdfjs-dist@${PDFJS_VERSION}/build`,
];

const MIN_ZOOM = 0.35, MAX_ZOOM = 6;
const RENDER_MARGIN = 1;      // pages kept rendered on each side of the viewport
const MAX_DPR = 2;            // cap device pixel ratio — phones run out of canvas memory fast
const MAX_CANVAS_PIXELS = 12e6;  // ~48 MB per page at 4 bytes/px
const RAIL_W = 26;               // reserved for the scrubber
const THUMB_W = 44;              // CSS px; rendered at 2x for the library list

const $ = id => document.getElementById(id);
const well = $('well'), pagesEl = $('pages'), rail = $('rail');

let pdfjsLib = null;
let doc = null;
let baseW = 612, baseH = 792; // page-1 dimensions at scale 1, used for placeholders
let fitScale = 1, zoom = 1, current = 1;
let currentId = null;         // library id of the open document, null if unsaved
let textCache = new Map(), hits = [], hitIndex = -1, searchToken = 0;

/* ── Utilities ───────────────────────────────────────────────── */
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

let statusTimer;
function status(msg, isError = false, ms = 2400) {
  const el = $('status');
  el.textContent = msg;
  el.classList.toggle('err', isError);
  el.classList.add('show');
  clearTimeout(statusTimer);
  if (ms) statusTimer = setTimeout(() => el.classList.remove('show'), ms);
}
function clearStatus() { clearTimeout(statusTimer); $('status').classList.remove('show'); }

/* ── Load PDF.js, trying each CDN in turn ────────────────────── */
async function loadPdfjs() {
  if (pdfjsLib) return pdfjsLib;
  let lastErr;
  for (const base of CDN_BASES) {
    try {
      const lib = await import(/* @vite-ignore */ `${base}/pdf.min.mjs`);
      lib.GlobalWorkerOptions.workerSrc = `${base}/pdf.worker.min.mjs`;
      pdfjsLib = lib;
      return lib;
    } catch (err) { lastErr = err; }
  }
  throw lastErr ?? new Error('PDF engine unavailable');
}

/* ── Storage ─────────────────────────────────────────────────────
   Two object stores kept deliberately separate: `docs` holds small
   metadata records that the library list reads on every open, and
   `files` holds the multi-megabyte blobs that it must never touch.
   ─────────────────────────────────────────────────────────────── */
const DB_NAME = 'leaf', DB_VERSION = 1;
let dbPromise = null;

function db() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VERSION); }
    catch (err) { return reject(err); }
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('docs'))  d.createObjectStore('docs',  { keyPath: 'id' });
      if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('database blocked'));
  });
  dbPromise.catch(() => { dbPromise = null; });   // allow a later retry
  return dbPromise;
}

function tx(store, mode, fn) {
  return db().then(d => new Promise((resolve, reject) => {
    const t = d.transaction(store, mode);
    const req = fn(t.objectStore(store));
    t.onabort = t.onerror = () => reject(t.error || new Error('transaction failed'));
    if (req) req.onsuccess = () => resolve(req.result);
    else t.oncomplete = () => resolve();
  }));
}

const dbGet    = (store, key)  => tx(store, 'readonly',  s => s.get(key));
const dbAll    = (store)       => tx(store, 'readonly',  s => s.getAll());
const dbPut    = (store, val)  => tx(store, 'readwrite', s => s.put(val));
const dbDelete = (store, key)  => tx(store, 'readwrite', s => s.delete(key));

/* A content hash means the same PDF opened from two places is one library
   entry, and reopening it from the picker restores where you were. */
async function hashBuffer(buffer, name) {
  try {
    const digest = await crypto.subtle.digest('SHA-256', buffer);
    return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch {
    // crypto.subtle needs a secure context. Sample the bytes instead.
    const view = new Uint8Array(buffer);
    let h = 0x811c9dc5;
    const step = Math.max(1, Math.floor(view.length / 8192));
    for (let i = 0; i < view.length; i += step) {
      h ^= view[i]; h = Math.imul(h, 0x01000193) >>> 0;
    }
    return `f${h.toString(16)}-${view.length}-${(name || '').length}`;
  }
}

/* Sandboxed iframes and private browsing both throw on indexedDB.open().
   Failing silently there makes the library look broken rather than unavailable,
   so probe once and say so. */
let storageOk = null;
async function probeStorage() {
  if (storageOk !== null) return storageOk;
  try { await db(); storageOk = true; }
  catch (err) { console.warn('Storage unavailable:', err); storageOk = false; }
  return storageOk;
}
let warnedNoStorage = false;

let persistRequested = false;
async function requestPersistence() {
  if (persistRequested) return;
  persistRequested = true;
  try { await navigator.storage?.persist?.(); } catch {}
}

function fmtSize(n) {
  if (!n && n !== 0) return '';
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(0)} KB`;
  return `${(n / 1048576).toFixed(1)} MB`;
}

/* ── Opening a document ──────────────────────────────────────── */
async function openFile(file) {
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    await openBuffer(buf, file.name || 'Untitled.pdf');
  } catch (err) {
    console.error(err);
    status('Could not read that file.', true);
  }
}

async function openBuffer(buffer, name, opts = {}) {
  status('Opening…', false, 0);
  let lib;
  try {
    lib = await loadPdfjs();
  } catch {
    status('PDF engine did not load. Check your connection and reload.', true, 6000);
    return;
  }

  const size = buffer.byteLength;
  let id = opts.id ?? null;
  let rec = null;

  if (!id) {
    try { id = await hashBuffer(buffer, name); } catch { id = null; }
  }
  if (id) {
    try { rec = await dbGet('docs', id); } catch { rec = null; }
  }

  // Store the bytes BEFORE pdf.js sees them. pdf.js transfers the typed array
  // to its worker, which detaches the underlying ArrayBuffer — read it after
  // and you get zero bytes.
  if (id && opts.fromLibrary !== true) {
    let hasBlob = false;
    try { hasBlob = !!(await dbGet('files', id))?.blob; } catch {}
    if (!hasBlob) {
      try {
        await requestPersistence();
        await dbPut('files', { id, blob: new Blob([buffer], { type: 'application/pdf' }) });
      } catch (err) {
        console.warn('Could not save to library:', err);
        if (err?.name === 'QuotaExceededError') {
          status('Out of storage — remove something from the library.', true, 5000);
        }
        id = null;   // opens fine, just won't be remembered
      }
    }
  }

  let next;
  try {
    // isEvalSupported:false blocks script execution paths in malformed fonts.
    next = await lib.getDocument({
      data: new Uint8Array(buffer),
      isEvalSupported: false,
      disableAutoFetch: true,
    }).promise;
  } catch (err) {
    console.error(err);
    const pw = err?.name === 'PasswordException';
    status(pw ? 'That PDF is password-protected.' : 'That file is not a readable PDF.', true, 5000);
    if (id && !rec) { try { await dbDelete('files', id); } catch {} }   // don't keep an unreadable file
    return;   // the document already open, if any, is left alone
  }

  // Only now tear down the previous document.
  cancelAll();
  if (doc) { try { await doc.destroy(); } catch {} }
  doc = next;
  currentId = id;

  document.title = `${name} — Leaf`;
  $('title').textContent = name;
  document.body.classList.remove('empty');
  document.body.classList.add('has-doc');
  closeLibrary();

  textCache.clear(); hits = []; hitIndex = -1;
  activeQuery = ''; outline = null; destCache.clear();
  document.body.classList.remove('has-outline');
  closeOutline(); closeDocInfo();
  docInfo = null; infoDirty = false;
  $('hits').textContent = ''; $('searchInput').value = '';
  $('jumpInput').max = doc.numPages;

  const first = await doc.getPage(1);
  const vp = first.getViewport({ scale: 1 });
  baseW = vp.width; baseH = vp.height;

  const resumePage = clamp(rec?.page || 1, 1, doc.numPages);
  resetDocument();
  zoom = clamp(rec?.zoom || 1, MIN_ZOOM, MAX_ZOOM);
  layout(true);
  current = resumePage;
  scrollToPage(resumePage, false);
  updateCounter();
  buildRail();
  clearStatus();
  loadOutline();                       // reveals the Contents button if there is one

  if (resumePage > 1) status(`Resumed on page ${resumePage}`, false, 1800);

  if (!id && !warnedNoStorage) {
    warnedNoStorage = true;
    status('Opened, but this browser is not saving it to the library.', false, 4000);
  }

  if (id) {
    const updated = {
      ...(rec || {}),
      id, name, size,
      pageCount: doc.numPages,
      page: resumePage,
      zoom,
      addedAt: rec?.addedAt ?? Date.now(),
      openedAt: Date.now(),
    };
    try { await dbPut('docs', updated); } catch {}
    if (!updated.thumb) makeThumb(id);      // fire and forget
  }
}

/* A small page-1 render, so the library looks like shelves rather than a list. */
async function makeThumb(id) {
  if (!doc) return;
  try {
    const page = await doc.getPage(1);
    const vp1 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: (THUMB_W * 2) / vp1.width });
    const c = document.createElement('canvas');
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    await page.render({
      canvasContext: c.getContext('2d', { alpha: false }),
      viewport: vp,
      background: '#FFFFFF',
    }).promise;
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.72));
    c.width = c.height = 0;
    if (!blob) return;
    const rec = await dbGet('docs', id);
    if (rec) { rec.thumb = blob; await dbPut('docs', rec); }
  } catch (err) {
    console.warn('Thumbnail failed:', err);   // cosmetic only
  }
}

/* ── Remembering where you were ──────────────────────────────── */
let saveTimer = 0;
function schedulePositionSave() {
  if (!currentId) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(savePosition, 800);
}
async function savePosition() {
  clearTimeout(saveTimer);
  if (!currentId || !doc) return;
  try {
    const rec = await dbGet('docs', currentId);
    if (!rec) return;
    rec.page = current; rec.zoom = zoom; rec.openedAt = Date.now();
    await dbPut('docs', rec);
  } catch {}
}
// Backgrounding the app is the moment most likely to be the last one.
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') savePosition(); });
addEventListener('pagehide', savePosition);

/* ── Geometry ────────────────────────────────────────────────────
   Page positions are computed arithmetically, never measured. Reading
   offsetTop in a scroll handler forces a synchronous layout, and doing
   it once per page per frame is what makes long documents crawl.
   ─────────────────────────────────────────────────────────────── */
const PAGE_GAP = 10;

let pageMeta = [];            // { w0, h0 } intrinsic size of every page
let geom = { tops: [], heights: [], widths: [], total: 0, pagesW: 0, scale: 1 };
let live = new Map();         // index -> { el, canvas, task, scale } for mounted pages
let insets = { top: 0, left: 0, right: 0, width: 0 };

function measureInsets() {
  const cs = getComputedStyle(well);
  insets = {
    top:   parseFloat(cs.paddingTop)  || 0,
    left:  parseFloat(cs.paddingLeft) || 0,
    right: parseFloat(cs.paddingRight) || 0,
    width: well.clientWidth,
  };
}

function contentWidth() {
  return insets.width - insets.left - insets.right - RAIL_W;
}

function computeGeometry() {
  const scale = fitScale * zoom;
  const n = pageMeta.length;
  const tops = new Float64Array(n), heights = new Float64Array(n), widths = new Float64Array(n);
  let y = 0, maxW = 0;
  for (let i = 0; i < n; i++) {
    const w = Math.round(pageMeta[i].w0 * scale);
    const h = Math.round(pageMeta[i].h0 * scale);
    widths[i] = w; heights[i] = h; tops[i] = y;
    y += h + PAGE_GAP;
    if (w > maxW) maxW = w;
  }
  geom = {
    tops, heights, widths, scale,
    total: Math.max(0, y - PAGE_GAP),
    // As wide as the widest page, so a zoomed page can scroll to BOTH edges.
    // Centring an overflowing box with flex or auto margins makes the left
    // side unreachable.
    pagesW: Math.max(maxW, contentWidth()),
  };
}

/* Smallest index whose bottom edge is still below the fold. */
function firstVisible(y) {
  const { tops, heights } = geom;
  let lo = 0, hi = tops.length - 1, ans = tops.length - 1;
  while (lo <= hi) {
    const m = (lo + hi) >> 1;
    if (tops[m] + heights[m] > y) { ans = m; hi = m - 1; } else lo = m + 1;
  }
  return ans;
}

function visibleRange() {
  const n = pageMeta.length;
  if (!n) return [0, -1];
  const y = well.scrollTop;
  const viewBottom = y + well.clientHeight - insets.top;
  const first = firstVisible(y);
  let last = first;
  while (last + 1 < n && geom.tops[last + 1] < viewBottom) last++;
  return [first, last];
}

/* ── Mounting ────────────────────────────────────────────────────
   Only pages in the render window exist in the DOM. A thousand-page
   document holds about five elements, so zoom and resize touch five
   nodes rather than a thousand.
   ─────────────────────────────────────────────────────────────── */
function placeEl(i, entry) {
  const el = entry.el;
  el.style.top    = geom.tops[i] + 'px';
  el.style.left   = Math.max(0, (geom.pagesW - geom.widths[i]) / 2) + 'px';
  el.style.width  = geom.widths[i] + 'px';
  el.style.height = geom.heights[i] + 'px';
}

function mount(i) {
  let entry = live.get(i);
  if (entry) return entry;
  const el = document.createElement('div');
  el.className = 'page';
  el.dataset.n = i + 1;
  entry = { el, canvas: null, task: null, scale: 0,
            textEl: null, textTask: null, linkEl: null,
            textDivs: null, items: null, norm: null, auxPending: null, marked: new Set() };
  live.set(i, entry);
  placeEl(i, entry);
  pagesEl.appendChild(el);
  return entry;
}

function unmount(i) {
  const entry = live.get(i);
  if (!entry) return;
  if (entry.task) { try { entry.task.cancel(); } catch {} entry.task = null; }
  dropAux(entry);
  dropCanvas(entry);
  entry.el.remove();
  live.delete(i);
}

function dropCanvas(entry) {
  if (!entry.canvas) return;
  entry.canvas.width = entry.canvas.height = 0;   // release the memory now
  entry.canvas.remove();
  entry.canvas = null;
}

function cancelAll() {
  for (const entry of live.values()) {
    if (entry.task) { try { entry.task.cancel(); } catch {} entry.task = null; }
  }
}

function resetDocument() {
  for (const i of [...live.keys()]) unmount(i);
  live.clear();
  pagesEl.replaceChildren();
  pageMeta = [];
  for (let n = 0; n < doc.numPages; n++) pageMeta.push({ w0: baseW, h0: baseH });
}

/* ── Sizing ──────────────────────────────────────────────────── */
function layout(recomputeFit) {
  if (!doc) return;
  if (recomputeFit) { measureInsets(); fitScale = contentWidth() / baseW; }
  const prevScale = geom.scale;
  computeGeometry();
  // Text and link layers are positioned in absolute pixels, so a scale change
  // strands them. renderPage rebuilds both once the new canvas is ready.
  if (Math.abs(geom.scale - prevScale) > 0.001) for (const e of live.values()) dropAux(e);

  pagesEl.style.width  = geom.pagesW + 'px';
  pagesEl.style.height = geom.total + 'px';

  // Reposition what is mounted. Existing canvases stay on screen, stretched by
  // CSS, until a sharper one arrives — blanking them makes zoom feel broken.
  for (const [i, entry] of live) placeEl(i, entry);

  $('zoomval').textContent = Math.round(zoom * 100) + '%';
  renderVisible();
}

function setZoom(next, after) {
  const z = clamp(next, MIN_ZOOM, MAX_ZOOM);
  if (Math.abs(z - zoom) < 0.001) return;
  zoom = z;
  layout(false);
  schedulePositionSave();
  if (after) requestAnimationFrame(after);
}

/* ── Rendering ───────────────────────────────────────────────── */
let renderScheduled = false;
function scheduleRender() {
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(() => { renderScheduled = false; renderVisible(); });
}

function renderVisible() {
  if (!doc || !pageMeta.length) return;
  const [first, last] = visibleRange();
  const lo = Math.max(0, first - RENDER_MARGIN);
  const hi = Math.min(pageMeta.length - 1, last + RENDER_MARGIN);

  // Unmount is proportional to what is mounted, not to document length.
  for (const i of [...live.keys()]) if (i < lo || i > hi) unmount(i);

  // The page being read is rendered before its neighbours.
  const order = [first];
  for (let i = lo; i <= hi; i++) if (i !== first) order.push(i);
  for (const i of order) {
    const entry = mount(i);
    if (entry.task) continue;
    if (entry.canvas && Math.abs(entry.scale - geom.scale) < 0.001) continue;
    renderPage(i, entry);
  }

  const nowCurrent = first + 1;
  if (nowCurrent !== current) {
    current = nowCurrent;
    updateCounter();
    moveThumb();
    schedulePositionSave();
  }
}

async function renderPage(i, entry) {
  const n = i + 1;
  let page;
  try { page = await doc.getPage(n); } catch { return; }
  if (!live.has(i) || live.get(i) !== entry) return;   // scrolled away while waiting

  const vp1 = page.getViewport({ scale: 1 });
  const meta = pageMeta[i];

  // Mixed-size documents: correct this page and reflow the ones after it.
  if (Math.abs(vp1.width - meta.w0) > 0.5 || Math.abs(vp1.height - meta.h0) > 0.5) {
    meta.w0 = vp1.width; meta.h0 = vp1.height;
    const anchorTop = geom.tops[current - 1];
    const delta = well.scrollTop - anchorTop;
    computeGeometry();
    pagesEl.style.width  = geom.pagesW + 'px';
    pagesEl.style.height = geom.total + 'px';
    for (const [j, e] of live) placeEl(j, e);
    // Keep the reader where they were rather than letting the page jump.
    well.scrollTop = geom.tops[current - 1] + delta;
  }

  const scale = geom.scale;
  const vp = page.getViewport({ scale });

  // Phones will hand back a blank canvas rather than throw if we ask for too much,
  // so trade sharpness for a canvas that actually paints.
  let dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
  while (vp.width * dpr * vp.height * dpr > MAX_CANVAS_PIXELS && dpr > 0.4) dpr *= 0.8;

  const canvas = document.createElement('canvas');
  canvas.width  = Math.max(1, Math.floor(vp.width  * dpr));
  canvas.height = Math.max(1, Math.floor(vp.height * dpr));
  const ctx = canvas.getContext('2d', { alpha: false });

  const task = page.render({
    canvasContext: ctx,
    viewport: vp,
    transform: dpr === 1 ? null : [dpr, 0, 0, dpr, 0, 0],
    background: '#FFFFFF',
  });
  entry.task = task;

  try {
    await task.promise;
    if (entry.task !== task || live.get(i) !== entry) { canvas.width = canvas.height = 0; return; }
    dropCanvas(entry);                 // swap only once the replacement is ready
    entry.el.appendChild(canvas);
    entry.canvas = canvas;
    entry.scale = scale;
    entry.el.classList.add('ready');
    requestAux(i, entry, page, vp);        // deferred while the user is still scrolling
  } catch (err) {
    canvas.width = canvas.height = 0;
    if (err?.name !== 'RenderingCancelledException') console.error(err);
  } finally {
    if (entry.task === task) entry.task = null;
  }
}

/* ── Text normalisation ──────────────────────────────────────────
   Builds one folded, whitespace-collapsed string per page, plus a map
   from every character in it back to the text item and character it came
   from. Matches are found in the flat string, then projected back onto
   the spans — which is what lets a phrase straddling two spans, two
   lines, or a hyphenated line break highlight correctly.

   Performance notes, because this runs over every page of a document:
   - ASCII is handled without touching Unicode machinery at all. Calling
     String.normalize() per character costs about 2 us; over a dense page
     that alone was ~5 ms, and a 900-page search spent seconds in it.
   - The position map is two Int32Arrays, not an array of objects. At one
     object per character a cached document was retaining millions of them.
   ─────────────────────────────────────────────────────────────── */

const DROP = /[\p{M}\p{Cf}\u00AD]/u;    // combining marks, format chars, soft hyphen
const SPACE = /\s/;

// Folded form of every ASCII code point, computed once.
const ASCII = new Array(128);
for (let i = 0; i < 128; i++) {
  ASCII[i] = String.fromCharCode(i >= 65 && i <= 90 ? i + 32 : i);
}

// Non-ASCII characters are folded once and remembered. Real documents draw
// on a small alphabet, so this settles after the first page.
const foldCache = new Map();

function fold(ch) {
  const code = ch.charCodeAt(0);
  if (code < 128) return code <= 32 ? ' ' : ASCII[code];
  let f = foldCache.get(ch);
  if (f === undefined) {
    let out = '';
    for (const c of ch.normalize('NFKD')) {
      if (DROP.test(c)) continue;
      out += c;
    }
    f = out.toLowerCase();
    foldCache.set(ch, f);
  }
  return f;
}

function normalizeQuery(q) {
  let out = '', lastSpace = true;
  for (const ch of q ?? '') {
    if (SPACE.test(ch)) { if (!lastSpace) { out += ' '; lastSpace = true; } continue; }
    const f = fold(ch);
    if (f && !SPACE.test(f)) { out += f; lastSpace = false; }
  }
  return out.trim();
}

/* items: the str-bearing entries from getTextContent(), which run exactly
   parallel to TextLayer's textDivs. */
function normalizeItems(items) {
  let cap = 16;
  for (let i = 0; i < items.length; i++) cap += (items[i].str?.length ?? 0) + 1;

  let posItem = new Int32Array(cap);
  let posChar = new Int32Array(cap);
  let text = '';
  let len = 0;
  let lastSpace = true;

  const grow = () => {
    const n = cap * 2;
    const pi = new Int32Array(n), pc = new Int32Array(n);
    pi.set(posItem); pc.set(posChar);
    posItem = pi; posChar = pc; cap = n;
  };
  const put = (ch, i, c) => {
    if (len >= cap) grow();
    text += ch; posItem[len] = i; posChar[len] = c; len++;
    lastSpace = false;
  };
  const putSpace = () => {
    if (lastSpace) return;
    if (len >= cap) grow();
    text += ' '; posItem[len] = -1; posChar[len] = -1; len++;
    lastSpace = true;
  };

  for (let i = 0; i < items.length; i++) {
    const raw = items[i].str ?? '';
    const eol = !!items[i].hasEOL;
    let end = raw.length;
    let dehyphenated = false;

    // A hyphen at a line break joins the word: "net-" + "work" -> "network".
    if (eol) {
      let t = end;
      while (t > 0 && SPACE.test(raw[t - 1])) t--;
      if (t > 0 && raw[t - 1] === '-') { end = t - 1; dehyphenated = true; }
    }

    for (let c = 0; c < end; c++) {
      const code = raw.charCodeAt(c);
      if (code < 128) {                       // fast path: no Unicode work
        if (code <= 32) putSpace();
        else put(ASCII[code], i, c);
        continue;
      }
      const f = fold(raw[c]);
      for (let k = 0; k < f.length; k++) {
        if (SPACE.test(f[k])) putSpace();
        else put(f[k], i, c);
      }
    }
    if (eol && !dehyphenated) putSpace();
  }

  while (len > 0 && text.charCodeAt(len - 1) === 32) { text = text.slice(0, -1); len--; }
  return { text, posItem, posChar, length: len };
}

/* Every occurrence of a normalised query in a normalised page. */
function findMatches(text, q) {
  const out = [];
  if (!q) return out;
  let at = text.indexOf(q);
  while (at >= 0) { out.push(at); at = text.indexOf(q, at + q.length); }
  return out;
}

/* Project one match onto the items it covers.
   Returns Map<itemIndex, {from, to}> as character ranges in that item's raw str. */
function matchToItemRanges(norm, start, length) {
  const { posItem, posChar } = norm;
  const byItem = new Map();
  for (let k = start; k < start + length; k++) {
    const i = posItem[k];
    if (i < 0) continue;                     // an inserted separator has no source
    const c = posChar[k];
    const r = byItem.get(i);
    if (!r) byItem.set(i, { from: c, to: c + 1 });
    else { if (c < r.from) r.from = c; if (c + 1 > r.to) r.to = c + 1; }
  }
  return byItem;
}

/* All matches on a page, grouped per item and sorted, ready to apply to spans.
   Returns Map<itemIndex, Array<{from, to, ord, active}>>. */
function pageHighlightPlan(norm, q, activeOrd = -1) {
  const plan = new Map();
  const starts = findMatches(norm.text, q);
  starts.forEach((start, ord) => {
    for (const [item, range] of matchToItemRanges(norm, start, q.length)) {
      if (!plan.has(item)) plan.set(item, []);
      plan.get(item).push({ from: range.from, to: range.to, ord, active: ord === activeOrd });
    }
  });
  for (const ranges of plan.values()) {
    ranges.sort((a, b) => a.from - b.from || a.to - b.to);
    // Defensive: never emit overlapping ranges into the DOM.
    for (let k = 1; k < ranges.length; k++) {
      if (ranges[k].from < ranges[k - 1].to) ranges[k].from = ranges[k - 1].to;
    }
  }
  return plan;
}

/* ── Text layer, links, and outline ──────────────────────────────
   The text layer is real DOM text positioned over the canvas. It is what
   makes selection, copy, search highlighting and screen readers work — a
   canvas alone offers none of those.
   ─────────────────────────────────────────────────────────────── */

let activeQuery = '';
let pendingMarkScroll = false;

/* The text layer costs a few hundred positioned spans per page. Building it
   mid-fling is invisible work that competes with rendering, so it waits for
   the scroll to settle. The canvas never waits. */
let scrolling = false, scrollIdle = 0;
function noteScrolling() {
  scrolling = true;
  clearTimeout(scrollIdle);
  scrollIdle = setTimeout(() => { scrolling = false; flushAux(); }, 150);
}
function requestAux(i, entry, page, vp) {
  entry.auxPending = { page, vp };
  if (!scrolling) flushAuxFor(i, entry);
}
function flushAuxFor(i, entry) {
  const p = entry.auxPending;
  if (!p || entry.textEl || entry.textTask) return;
  entry.auxPending = null;
  mountAux(i, entry, p.page, p.vp);
}
function flushAux() { for (const [i, e] of live) flushAuxFor(i, e); }
let outline = null;
const destCache = new Map();

function dropAux(entry) {
  if (entry.textTask) { try { entry.textTask.cancel(); } catch {} entry.textTask = null; }
  if (entry.textEl) { entry.textEl.remove(); entry.textEl = null; }
  if (entry.linkEl) { entry.linkEl.remove(); entry.linkEl = null; }
  entry.textDivs = null; entry.items = null; entry.norm = null;
  entry.auxPending = null; entry.marked?.clear();
}

async function mountAux(i, entry, page, vp) {
  if (!pdfjsLib?.TextLayer) return;
  dropAux(entry);

  const div = document.createElement('div');
  div.className = 'textLayer';
  div.style.setProperty('--scale-factor', vp.scale);   // pdf.js positions its spans against this
  entry.el.appendChild(div);
  entry.textEl = div;

  // One fetch serves both the rendered layer and the search index, so the
  // highlight positions and the match count can never disagree.
  let textContent;
  try { textContent = await page.getTextContent(); } catch { return; }
  if (live.get(i) !== entry) return;

  const items = textContent.items.filter(it => it.str !== undefined);
  entry.items = items;
  entry.norm = normalizeItems(items);
  // Only the folded string is cached document-wide. The position map is ~22 KB
  // per page and is discarded with the entry when the page scrolls away.
  if (!textCache.has(i + 1)) textCache.set(i + 1, entry.norm.text);

  const layer = new pdfjsLib.TextLayer({
    textContentSource: textContent,
    container: div,
    viewport: vp,
  });
  entry.textTask = layer;

  try {
    await layer.render();
  } catch (err) {
    if (err?.name !== 'AbortException') console.warn('Text layer failed:', err);
    return;
  } finally {
    if (entry.textTask === layer) entry.textTask = null;
  }
  if (live.get(i) !== entry) { dropAux(entry); return; }   // scrolled away mid-render

  entry.textDivs = layer.textDivs;
  applyHighlights(i, entry);
  mountLinks(i, entry, page, vp);
}

/* Internal links jump within the document; external ones are restricted to
   http(s), since a PDF can name any scheme it likes. */
async function mountLinks(i, entry, page, vp) {
  let annots;
  try { annots = await page.getAnnotations({ intent: 'display' }); } catch { return; }
  if (live.get(i) !== entry) return;

  const links = annots.filter(a => a.subtype === 'Link' && (a.dest || a.url));
  if (!links.length) return;

  const holder = document.createElement('div');
  holder.className = 'linkLayer';

  for (const a of links) {
    const [x1, y1, x2, y2] = vp.convertToViewportRectangle(a.rect);
    const el = document.createElement('a');
    el.style.left   = Math.min(x1, x2) + 'px';
    el.style.top    = Math.min(y1, y2) + 'px';
    el.style.width  = Math.abs(x2 - x1) + 'px';
    el.style.height = Math.abs(y2 - y1) + 'px';

    if (a.url) {
      let safe = false;
      try { safe = /^https?:$/.test(new URL(a.url).protocol); } catch {}
      if (!safe) continue;
      el.href = a.url; el.target = '_blank'; el.rel = 'noopener noreferrer';
      el.setAttribute('aria-label', `Open link: ${a.url}`);
    } else {
      el.href = '#';
      el.setAttribute('aria-label', 'Go to linked section');
      el.onclick = async e => {
        e.preventDefault();
        const p = await destToPage(a.dest);
        if (p) goToPage(p);
        else status('That link does not point anywhere in this document.', true);
      };
    }
    holder.appendChild(el);
  }
  if (!holder.children.length) return;
  entry.el.appendChild(holder);
  entry.linkEl = holder;
}

/* Resolve a PDF destination — named or explicit — to a 1-based page number. */
async function destToPage(dest) {
  if (!dest || !doc) return null;
  const key = typeof dest === 'string' ? dest : JSON.stringify(dest);
  if (destCache.has(key)) return destCache.get(key);
  let result = null;
  try {
    const explicit = typeof dest === 'string' ? await doc.getDestination(dest) : dest;
    const ref = Array.isArray(explicit) ? explicit[0] : null;
    if (ref && typeof ref === 'object') result = (await doc.getPageIndex(ref)) + 1;
    else if (Number.isInteger(ref)) result = ref + 1;
  } catch { result = null; }
  destCache.set(key, result);
  return result;
}

function goToPage(n) {
  const p = clamp(n, 1, doc?.numPages || 1);
  current = p;
  updateCounter();
  moveThumb();
  scrollToPage(p, true);
}

/* ── Search highlighting ─────────────────────────────────────────
   Matches are found in the flat normalised page string and projected back
   onto the spans through the position map, so a phrase straddling spans,
   lines or a hyphenated break highlights across all of them.
   ─────────────────────────────────────────────────────────────── */
function applyHighlights(i, entry) {
  const divs = entry.textDivs, items = entry.items;
  if (!divs || !items) return;

  // Restore anything previously marked, using the item strings as the source
  // of truth rather than trying to unpick the DOM.
  if (entry.marked?.size) {
    for (const k of entry.marked) {
      if (divs[k] && items[k]) divs[k].textContent = items[k].str;
    }
    entry.marked.clear();
  } else {
    entry.marked = new Set();
  }
  if (!activeQuery) return;

  if (!entry.norm) return;
  const active = (hitIndex >= 0 && hits[hitIndex]?.page === i + 1) ? hits[hitIndex].ord : -1;
  const plan = pageHighlightPlan(entry.norm, activeQuery, active);

  let activeMark = null;
  for (const [k, ranges] of plan) {
    const div = divs[k], item = items[k];
    if (!div || !item) continue;              // textDivs are capped on huge pages
    const raw = item.str;
    const frag = document.createDocumentFragment();
    let at = 0;
    for (const r of ranges) {
      if (r.from > at) frag.appendChild(document.createTextNode(raw.slice(at, r.from)));
      const mark = document.createElement('mark');
      mark.className = r.active ? 'hl on' : 'hl';
      mark.textContent = raw.slice(r.from, r.to);
      frag.appendChild(mark);
      if (r.active && !activeMark) activeMark = mark;
      at = r.to;
    }
    if (at < raw.length) frag.appendChild(document.createTextNode(raw.slice(at)));
    div.replaceChildren(frag);
    entry.marked.add(k);
  }

  if (activeMark && pendingMarkScroll) {
    pendingMarkScroll = false;
    revealMark(i, activeMark);
  }
}

/* Centre the active match, rather than just landing on its page. */
function revealMark(i, mark) {
  const y = geom.tops[i] + mark.offsetTop;      // one-off read, not in the scroll path
  const target = y - (well.clientHeight - insets.top) / 2;
  well.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
}

function refreshHighlights() {
  for (const [i, entry] of live) applyHighlights(i, entry);
}

/* ── Outline ─────────────────────────────────────────────────── */
async function loadOutline() {
  outline = null;
  destCache.clear();
  try { outline = await doc.getOutline(); } catch { outline = null; }
  const has = Array.isArray(outline) && outline.length > 0;
  document.body.classList.toggle('has-outline', has);
  return has;
}

function countOutline(items) {
  let n = 0;
  for (const it of items || []) n += 1 + countOutline(it.items);
  return n;
}

function buildOutline(items, depth, container) {
  for (const item of items) {
    const kids = Array.isArray(item.items) ? item.items : [];
    const row = document.createElement('div');
    row.className = 'ol-row';
    row.style.paddingLeft = (depth * 15) + 'px';

    let childBox = null;
    if (kids.length) {
      const twist = document.createElement('button');
      twist.className = 'ol-twist';
      twist.setAttribute('aria-expanded', depth === 0 ? 'true' : 'false');
      twist.setAttribute('aria-label', 'Expand section');
      twist.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
      twist.onclick = () => {
        const open = twist.getAttribute('aria-expanded') === 'true';
        twist.setAttribute('aria-expanded', String(!open));
        if (childBox) childBox.hidden = open;
      };
      row.appendChild(twist);
    } else {
      const gap = document.createElement('span');
      gap.className = 'ol-spacer';
      row.appendChild(gap);
    }

    const title = document.createElement('button');
    title.className = 'ol-title';
    title.textContent = item.title?.trim() || 'Untitled section';
    if (item.bold) title.style.fontWeight = '650';
    if (item.italic) title.style.fontStyle = 'italic';
    row.appendChild(title);

    const pageTag = document.createElement('span');
    pageTag.className = 'ol-page';
    row.appendChild(pageTag);

    title.onclick = async () => {
      if (item.url) {
        let safe = false;
        try { safe = /^https?:$/.test(new URL(item.url).protocol); } catch {}
        if (safe) window.open(item.url, '_blank', 'noopener,noreferrer');
        return;
      }
      const p = await destToPage(item.dest);
      if (!p) return status('That entry does not point anywhere in this document.', true);
      closeOutline();
      goToPage(p);
    };

    container.appendChild(row);

    // Resolve the page number lazily so a large outline opens immediately.
    if (!item.url) {
      destToPage(item.dest).then(p => { if (p) pageTag.textContent = p; });
    }

    if (kids.length) {
      childBox = document.createElement('div');
      childBox.className = 'ol-children';
      childBox.hidden = depth !== 0;
      buildOutline(kids, depth + 1, childBox);
      container.appendChild(childBox);
    }
  }
}

function renderOutline() {
  const list = $('outlineList');
  list.replaceChildren();
  if (!outline?.length) {
    const blank = document.createElement('div');
    blank.className = 'lib-blank';
    blank.textContent = 'This PDF has no embedded table of contents.';
    list.appendChild(blank);
    $('outlineSub').textContent = '';
    return;
  }
  const total = countOutline(outline);
  $('outlineSub').textContent = `${total} entr${total === 1 ? 'y' : 'ies'}`;
  buildOutline(outline, 0, list);
}

function openOutline() {
  closePanels();
  closeLibrary();
  $('outline').classList.add('open');
  renderOutline();
}
function closeOutline() { $('outline').classList.remove('open'); }

$('outlineBtn').onclick = openOutline;
$('outlineClose').onclick = closeOutline;

/* ── Document info ───────────────────────────────────────────────
   Viewing is pdf.js. Editing is not: pdf.js is a reader and cannot
   write PDFs at all, so saving pulls in pdf-lib, which re-serialises
   the file. Two consequences drive the design here:

   - An encrypted PDF must be refused. pdf-lib's ignoreEncryption does
     not decrypt; it copies still-encrypted streams into a file with no
     encryption dictionary, and the result does not open in any reader.
   - The original bytes are needed to save, and pdf.js has already
     detached the buffer it was given. They come back from the library
     copy in IndexedDB, so a document that was never saved cannot be
     edited.
   ─────────────────────────────────────────────────────────────── */

const PDFLIB_SOURCES = [
  'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.esm.min.js',
  'https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.esm.min.js',
];
const EDITABLE = ['Title', 'Author', 'Subject', 'Keywords', 'Creator', 'Producer'];

let pdfLib = null;
let docInfo = null;      // { info, metadata } from pdf.js
let infoDirty = false;

async function loadPdfLib() {
  if (pdfLib) return pdfLib;
  let lastErr;
  for (const url of PDFLIB_SOURCES) {
    try { pdfLib = await import(/* @vite-ignore */ url); return pdfLib; }
    catch (err) { lastErr = err; }
  }
  throw lastErr ?? new Error('PDF writer unavailable');
}

/* "D:20260102030405+01'00'" -> a readable local date. */
function pdfDate(raw) {
  if (!raw) return null;
  const m = /^D:(\d{4})(\d{2})?(\d{2})?(\d{2})?(\d{2})?(\d{2})?/.exec(String(raw));
  if (!m) return String(raw);
  const [, y, mo, d, hh, mm, ss] = m;
  const dt = new Date(Date.UTC(+y, (+mo || 1) - 1, +d || 1, +hh || 0, +mm || 0, +ss || 0));
  if (isNaN(dt)) return String(raw);
  return dt.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

function isEncrypted() {
  return !!docInfo?.info?.EncryptFilterName;
}

function row(dt, dd, mono) {
  if (dd === undefined || dd === null || dd === '') return null;
  const el = document.createElement('div');
  el.className = 'info-row';
  const k = document.createElement('dt'); k.textContent = dt;
  const v = document.createElement('dd'); v.textContent = String(dd);
  if (mono) v.className = 'mono';
  el.append(k, v);
  return el;
}

function section(title) {
  const el = document.createElement('div');
  el.className = 'info-section';
  el.textContent = title;
  return el;
}

function note(title, body) {
  const el = document.createElement('div');
  el.className = 'info-note';
  const b = document.createElement('strong'); b.textContent = title;
  el.append(b, document.createTextNode(body));
  return el;
}

async function renderDocInfo() {
  const body = $('infoBody');
  body.replaceChildren();
  $('infoFoot').hidden = true;
  if (!doc) return;

  try { docInfo = await doc.getMetadata(); }
  catch { docInfo = { info: {}, metadata: null }; }
  const info = docInfo.info || {};

  const rec = currentId ? await dbGet('docs', currentId).catch(() => null) : null;
  const canEdit = !!currentId && !isEncrypted();

  $('infoSub').textContent = `${doc.numPages} page${doc.numPages === 1 ? '' : 's'}`;

  // ── Editable fields ──
  body.appendChild(section('Metadata'));
  for (const key of EDITABLE) {
    const field = document.createElement('div');
    field.className = 'info-field';
    const label = document.createElement('label');
    label.textContent = key;
    label.setAttribute('for', `meta-${key}`);
    const input = document.createElement('input');
    input.id = `meta-${key}`;
    input.type = 'text';
    input.value = info[key] ?? '';
    input.dataset.key = key;
    input.disabled = !canEdit;
    input.addEventListener('input', () => { infoDirty = true; });
    field.append(label, input);
    body.appendChild(field);
  }

  if (canEdit) {
    $('infoFoot').hidden = false;
  } else if (isEncrypted()) {
    body.appendChild(note('This PDF is encrypted — metadata is read-only.',
      'Rewriting an encrypted file would leave its contents scrambled and the ' +
      'document unopenable, so editing is disabled rather than risking your file.'));
  } else {
    body.appendChild(note('Not in your library — metadata is read-only.',
      'Saving needs the original file bytes, which are kept in the library. ' +
      'This document was opened without being saved, so there is nothing to rewrite.'));
  }

  // ── Read-only facts ──
  body.appendChild(section('Document'));
  const facts = [
    row('Pages', doc.numPages, true),
    row('File size', rec?.size ? fmtSize(rec.size) : null, true),
    row('PDF version', info.PDFFormatVersion, true),
    row('Created', pdfDate(info.CreationDate)),
    row('Modified', pdfDate(info.ModDate)),
    row('Language', info.Language),
    row('Encryption', info.EncryptFilterName ?? 'None'),
    row('Linearized', info.IsLinearized ? 'Yes' : 'No'),
    row('Forms', info.IsAcroFormPresent ? (info.IsXFAPresent ? 'AcroForm + XFA' : 'AcroForm') : 'None'),
    row('Signatures', info.IsSignaturesPresent ? 'Present' : 'None'),
    row('XMP metadata', docInfo.metadata ? 'Present' : 'None'),
  ].filter(Boolean);
  for (const f of facts) body.appendChild(f);

  if (info.IsSignaturesPresent && canEdit) {
    body.appendChild(note('This PDF is digitally signed.',
      'Saving rewrites the file, which will invalidate the signature. The original ' +
      'stays in your library until you choose to replace it.'));
  }
  if (docInfo.metadata && canEdit) {
    body.appendChild(note('This PDF also carries XMP metadata.',
      'Some readers prefer XMP over the fields above, so they may keep showing the ' +
      'old title after you save. Only the standard fields are edited here.'));
  }
  infoDirty = false;
}

async function saveDocInfo() {
  if (!currentId || isEncrypted()) return;

  const changes = {};
  for (const key of EDITABLE) {
    const el = document.getElementById(`meta-${key}`);
    if (el) changes[key] = el.value;
  }

  status('Saving…', false, 0);
  let lib;
  try { lib = await loadPdfLib(); }
  catch { return status('Could not load the PDF writer. Check your connection.', true, 5000); }

  let bytes;
  try {
    const file = await dbGet('files', currentId);
    if (!file?.blob) throw new Error('missing');
    bytes = new Uint8Array(await file.blob.arrayBuffer());
  } catch {
    return status('The original file is no longer in your library.', true, 5000);
  }

  let out;
  try {
    const pdf = await lib.PDFDocument.load(bytes, { updateMetadata: false });
    pdf.setTitle(changes.Title || '');
    pdf.setAuthor(changes.Author || '');
    pdf.setSubject(changes.Subject || '');
    pdf.setKeywords(changes.Keywords ? changes.Keywords.split(/[,;]\s*/).filter(Boolean) : []);
    pdf.setCreator(changes.Creator || '');
    pdf.setProducer(changes.Producer || '');
    pdf.setModificationDate(new Date());
    out = await pdf.save();
  } catch (err) {
    console.error(err);
    return status('That PDF could not be rewritten. It has been left untouched.', true, 5000);
  }

  // Verify before replacing anything. A file that no longer opens is far worse
  // than a title that did not change.
  try {
    const check = await pdfjsLib.getDocument({ data: out.slice(), isEvalSupported: true }).promise;
    if (check.numPages !== doc.numPages) throw new Error('page count changed');
    await check.destroy();
  } catch (err) {
    console.error(err);
    return status('The rewritten file failed its check, so nothing was changed.', true, 6000);
  }

  const name = $('title').textContent;
  offerDownload(out, name);

  // Re-key under the new content hash and carry the reading position over.
  try {
    const oldId = currentId;
    const rec = await dbGet('docs', oldId).catch(() => null);
    const buf = out.buffer.slice(0);
    const newId = await hashBuffer(buf, name);
    await dbPut('files', { id: newId, blob: new Blob([buf], { type: 'application/pdf' }) });
    await dbPut('docs', {
      ...(rec || {}), id: newId, name, size: buf.byteLength,
      pageCount: doc.numPages, openedAt: Date.now(),
    });
    if (newId !== oldId) { await dbDelete('files', oldId); await dbDelete('docs', oldId); }
    currentId = newId;
  } catch (err) {
    console.warn('Library update failed:', err);
    status('Saved and downloaded, but the library copy could not be updated.', true, 5000);
    return;
  }

  infoDirty = false;
  status('Metadata saved. The edited file has also been downloaded.', false, 4000);
  renderDocInfo();
}

function offerDownload(bytes, name) {
  try {
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = /\.pdf$/i.test(name) ? name : `${name}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  } catch (err) { console.warn('Download failed:', err); }
}

function openDocInfo() {
  if (!doc) return status('Open a PDF first.');
  closePanels(); closeLibrary(); closeOutline();
  $('docinfo').classList.add('open');
  renderDocInfo();
}
function closeDocInfo() { $('docinfo').classList.remove('open'); }

$('infoBtn').onclick = openDocInfo;
$('infoClose').onclick = closeDocInfo;
$('infoSave').onclick = saveDocInfo;

/* ── Page rail ───────────────────────────────────────────────── */
function buildRail() {
  rail.querySelectorAll('.tick').forEach(t => t.remove());
  const n = doc.numPages;
  if (n <= 1) return;
  const step = n <= 60 ? 1 : Math.ceil(n / 60);
  const frag = document.createDocumentFragment();
  for (let p = 1; p <= n; p += step) {
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.top = ((p - 1) / (n - 1) * 100) + '%';
    frag.appendChild(tick);
  }
  rail.insertBefore(frag, rail.firstChild);
  moveThumb();
}

function moveThumb() {
  if (!doc || doc.numPages < 2) return;
  const f = (current - 1) / (doc.numPages - 1);
  $('thumb').style.top = (f * 100) + '%';
  $('flag').style.top  = (f * 100) + '%';
}

function scrollToPage(n, smooth) {
  const i = clamp(n, 1, pageMeta.length) - 1;
  if (!geom.tops.length) return;
  well.scrollTo({ top: geom.tops[i], behavior: smooth ? 'smooth' : 'auto' });
}

rail.addEventListener('pointerdown', e => {
  if (!doc) return;
  rail.setPointerCapture(e.pointerId);
  rail.classList.add('scrubbing');
  scrubTo(e);
});
rail.addEventListener('pointermove', e => { if (rail.classList.contains('scrubbing')) scrubTo(e); });
['pointerup', 'pointercancel'].forEach(ev =>
  rail.addEventListener(ev, () => rail.classList.remove('scrubbing')));

function scrubTo(e) {
  const r = rail.getBoundingClientRect();
  const f = clamp((e.clientY - r.top) / r.height, 0, 1);
  const n = Math.round(f * (doc.numPages - 1)) + 1;
  $('flag').textContent = `${n} / ${doc.numPages}`;
  $('thumb').style.top = (f * 100) + '%';
  $('flag').style.top  = (f * 100) + '%';
  if (n !== current) { current = n; updateCounter(); scrollToPage(n, false); }
}

function updateCounter() {
  $('counter').textContent = doc ? `${current} / ${doc.numPages}` : '—';
}

/* ── Scroll & resize ─────────────────────────────────────────── */
let scrollRaf = 0;
well.addEventListener('scroll', () => {
  noteScrolling();
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; renderVisible(); });
}, { passive: true });

let resizeTimer;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!doc) return;
    const keep = current;
    layout(true);
    scrollToPage(keep, false);
  }, 180);
});

/* ── Pinch to zoom ───────────────────────────────────────────── */
let pinch = null;
const touchDist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

well.addEventListener('touchstart', e => {
  if (!doc || e.touches.length !== 2) return;
  const t = [e.touches[0], e.touches[1]];
  const midY = (t[0].clientY + t[1].clientY) / 2;
  const midX = (t[0].clientX + t[1].clientX) / 2;
  pinch = {
    d0: touchDist(t), z0: zoom, k: 1, midY, midX,
    // Offsets are relative to #pages, which starts at the well's padding edge.
    originY: midY + well.scrollTop - insets.top,
    originX: midX + well.scrollLeft - insets.left,
  };
  pagesEl.style.willChange = 'transform';        // only for the duration of the gesture
  pagesEl.style.transformOrigin = `${pinch.originX}px ${pinch.originY}px`;
}, { passive: true });

well.addEventListener('touchmove', e => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  const k = touchDist([e.touches[0], e.touches[1]]) / pinch.d0;
  pinch.k = clamp(k, MIN_ZOOM / pinch.z0, MAX_ZOOM / pinch.z0);
  pagesEl.style.transform = `scale(${pinch.k})`;
}, { passive: false });

function endPinch() {
  if (!pinch) return;
  const p = pinch; pinch = null;
  pagesEl.style.transform = '';
  pagesEl.style.transformOrigin = '';
  pagesEl.style.willChange = '';
  const target = clamp(p.z0 * p.k, MIN_ZOOM, MAX_ZOOM);
  const applied = target / p.z0;
  const nextTop  = insets.top  + p.originY * applied - p.midY;
  const nextLeft = insets.left + p.originX * applied - p.midX;
  setZoom(target, () => {
    well.scrollTop  = nextTop;
    well.scrollLeft = nextLeft;
  });
}
well.addEventListener('touchend', e => { if (pinch && e.touches.length < 2) endPinch(); });
well.addEventListener('touchcancel', endPinch);

/* ── Tap to hide chrome, double-tap to zoom ──────────────────── */
let tapStart = null, lastTap = 0;
well.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  tapStart = { x: e.clientX, y: e.clientY, t: Date.now(), top: well.scrollTop };
});
well.addEventListener('pointerup', e => {
  if (!tapStart || !doc || pinch) { tapStart = null; return; }
  const moved = Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y);
  const scrolled = Math.abs(well.scrollTop - tapStart.top);
  const quick = Date.now() - tapStart.t < 400;
  tapStart = null;
  if (moved > 12 || scrolled > 6 || !quick) return;

  const now = Date.now();
  if (now - lastTap < 300) {           // double tap
    lastTap = 0;
    setZoom(zoom > 1.05 ? 1 : 2);
    return;
  }
  lastTap = now;
  setTimeout(() => {
    if (lastTap && Date.now() - lastTap >= 290) {
      document.body.classList.toggle('immersive');
      closePanels();
    }
  }, 300);
});

/* ── Search ──────────────────────────────────────────────────── */
async function pageText(n) {
  let text = textCache.get(n);
  if (text !== undefined) return text;
  try {
    const page = await doc.getPage(n);
    const tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str !== undefined);
    text = normalizeItems(items).text;      // the position map is dropped here
  } catch { text = ''; }
  textCache.set(n, text);
  return text;
}

async function runSearch(query) {
  const token = ++searchToken;
  hits = []; hitIndex = -1;
  const q = normalizeQuery(query);
  activeQuery = q;
  refreshHighlights();

  if (!q || !doc) { $('hits').textContent = ''; return; }

  $('hits').textContent = '…';
  let textSeen = 0;
  for (let n = 1; n <= doc.numPages; n++) {
    if (token !== searchToken) return;
    const text = await pageText(n);
    if (token !== searchToken) return;
    textSeen += text.length;

    const starts = findMatches(text, q);
    starts.forEach((at, ord) => hits.push({ page: n, ord, at }));

    if (starts.length && hitIndex < 0) { hitIndex = 0; goToHit(0); }
    else if (starts.length) $('hits').textContent = `${hitIndex + 1} of ${hits.length}`;
  }
  if (token !== searchToken) return;
  if (hits.length) { $('hits').textContent = `${hitIndex + 1} of ${hits.length}`; return; }

  // Distinguish "not in this document" from "this document has no text at all".
  // A scan is just pictures of words; nothing can match until it is OCR'd.
  if (textSeen === 0) {
    $('hits').textContent = 'No text';
    status('This PDF has no text layer — it is a scan. Searching needs OCR first.', true, 6000);
  } else {
    $('hits').textContent = 'No matches';
  }
}

function goToHit(i) {
  if (!hits.length) return;
  hitIndex = (i % hits.length + hits.length) % hits.length;
  const hit = hits[hitIndex];
  $('hits').textContent = `${hitIndex + 1} of ${hits.length}`;
  pendingMarkScroll = true;
  if (hit.page !== current) {
    current = hit.page; updateCounter(); moveThumb();
    scrollToPage(hit.page, false);      // revealMark centres it once highlighted
  }
  refreshHighlights();
}

let searchTimer;
$('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  activeQuery = normalizeQuery(v);
  refreshHighlights();                 // instant on what's already on screen
  searchTimer = setTimeout(() => runSearch(v), 280);
});
$('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); goToHit(hitIndex + 1); }
});
$('hitNext').onclick = () => goToHit(hitIndex + 1);
$('hitPrev').onclick = () => goToHit(hitIndex - 1);

/* A page of a scan yields no text items at all. Say so up front rather than
   letting the user conclude that search is broken. */
function warnIfPageHasNoText() {
  const entry = live.get(current - 1);
  if (!entry) return;
  if (entry.norm && entry.norm.text.trim() === '') {
    status('This page has no text layer — it looks like a scan.', true, 5000);
  }
}

/* ── Panels ──────────────────────────────────────────────────── */
function closePanels() {
  if ($('searchPanel').classList.contains('open') && activeQuery) {
    activeQuery = '';
    refreshHighlights();
  }
  $('searchPanel').classList.remove('open');
  $('jumpPanel').classList.remove('open');
  $('appearPanel').classList.remove('open');
  $('searchBtn').setAttribute('aria-pressed', 'false');
  $('appearBtn').setAttribute('aria-pressed', 'false');
}
function togglePanel(panel, input) {
  const open = panel.classList.contains('open');
  closePanels();
  if (!open) { panel.classList.add('open'); input.focus(); input.select?.(); }
}

$('searchBtn').onclick = () => {
  if (!doc) return status('Open a PDF first.');
  const opening = !$('searchPanel').classList.contains('open');
  togglePanel($('searchPanel'), $('searchInput'));
  $('searchBtn').setAttribute('aria-pressed', String(opening));
  document.body.classList.remove('immersive');
  if (opening) warnIfPageHasNoText();
};
$('counter').onclick = () => {
  if (!doc) return;
  togglePanel($('jumpPanel'), $('jumpInput'));
  document.body.classList.remove('immersive');
};
function doJump() {
  const n = parseInt($('jumpInput').value, 10);
  if (!n || n < 1 || n > doc.numPages) return status(`Enter a page between 1 and ${doc.numPages}.`, true);
  current = n; updateCounter(); moveThumb();
  scrollToPage(n, true);
  closePanels();
  $('jumpInput').blur();
}
$('jumpGo').onclick = doJump;
$('jumpInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doJump(); } });

/* ── Toolbar ─────────────────────────────────────────────────── */
/* ── Appearance: two independent settings ───────────────────── */
/* Page theme changes how the document is rendered.
   Interface theme changes the chrome. Neither touches the other. */

const darkMedia = matchMedia('(prefers-color-scheme: dark)');
const THEME_COLOR = { light: '#F2F3F0', dark: '#1B1F22' };

let pageTheme = 'day';
let textDebug = 'off';
let uiPref = 'auto';               // 'light' | 'dark' | 'auto'

const resolvedUi = () => uiPref === 'auto' ? (darkMedia.matches ? 'dark' : 'light') : uiPref;

function applyAppearance() {
  document.body.dataset.page = pageTheme;
  document.body.dataset.textdebug = textDebug;
  document.body.dataset.ui = resolvedUi();
  document.querySelector('meta[name="theme-color"]').content = THEME_COLOR[resolvedUi()];

  for (const b of $('pageSeg').children) {
    b.setAttribute('aria-pressed', String(b.dataset.page === pageTheme));
  }
  for (const b of $('textSeg').children) {
    b.setAttribute('aria-pressed', String(b.dataset.text === textDebug));
  }
  for (const b of $('uiSeg').children) {
    b.setAttribute('aria-pressed', String(b.dataset.ui === uiPref));
  }
}

$('pageSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) { pageTheme = b.dataset.page; applyAppearance(); }
});
$('textSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  textDebug = b.dataset.text;
  applyAppearance();
  if (textDebug === 'on') status('Blue boxes are the extracted text.', false, 3200);
});
$('uiSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) { uiPref = b.dataset.ui; applyAppearance(); }
});
darkMedia.addEventListener?.('change', () => { if (uiPref === 'auto') applyAppearance(); });

applyAppearance();

$('appearBtn').onclick = () => {
  const opening = !$('appearPanel').classList.contains('open');
  closePanels();
  if (opening) $('appearPanel').classList.add('open');
  $('appearBtn').setAttribute('aria-pressed', String(opening));
  document.body.classList.remove('immersive');
};

$('zoomIn').onclick  = () => setZoom(zoom * 1.25);
$('zoomOut').onclick = () => setZoom(zoom / 1.25);
$('fitBtn').onclick  = () => { setZoom(1); status('Fit to width', false, 900); };

$('openBtn').onclick   = () => $('fileInput').click();
$('emptyOpen').onclick = () => $('fileInput').click();
$('fileInput').addEventListener('change', e => {
  const f = e.target.files?.[0];
  e.target.value = '';
  openFile(f);
});

addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if ($('docinfo').classList.contains('open')) {
    if (e.key === 'Escape') { e.preventDefault(); closeDocInfo(); }
    return;
  }
  if ($('outline').classList.contains('open')) {
    if (e.key === 'Escape') { e.preventDefault(); closeOutline(); }
    return;                                  // don't drive the document underneath
  }
  if ($('library').classList.contains('open')) {
    if (e.key === 'Escape') { e.preventDefault(); closeLibrary(); }
    return;
  }
  if (e.key === 'Escape') { closePanels(); return; }
  if (!doc) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); scrollToPage(current + 1, true); }
  if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   { e.preventDefault(); scrollToPage(current - 1, true); }
  if (e.key === 'Home') { e.preventDefault(); scrollToPage(1, true); }
  if (e.key === 'End')  { e.preventDefault(); scrollToPage(doc.numPages, true); }
  if (e.key === '+' || e.key === '=') setZoom(zoom * 1.25);
  if (e.key === '-') setZoom(zoom / 1.25);
  if (e.key === '0') setZoom(1);
});

/* Drag and drop, for desktop testing */
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  const f = [...(e.dataTransfer?.files || [])].find(f => f.type === 'application/pdf');
  if (f) openFile(f);
});

/* ── Share target pickup ─────────────────────────────────────── */
async function checkShared() {
  const params = new URLSearchParams(location.search);
  if (!params.has('shared')) return;
  history.replaceState(null, '', location.pathname);
  try {
    const cache = await caches.open('leaf-share');
    const res = await cache.match('shared-file');
    if (!res) return;
    const name = decodeURIComponent(res.headers.get('x-filename') || 'Shared.pdf');
    const buf = await res.arrayBuffer();
    await cache.delete('shared-file');
    await openBuffer(buf, name);
  } catch (err) {
    console.error(err);
    status('Could not open the shared file.', true);
  }
}

/* ── File handler launch (desktop Chrome/Edge; ignored on Android) ── */
if ('launchQueue' in window) {
  window.launchQueue.setConsumer(async params => {
    const handle = params?.files?.[0];
    if (!handle) return;
    try { await openFile(await handle.getFile()); }
    catch { status('Could not open that file.', true); }
  });
}

/* ── Service worker (offline + share target) ─────────────────── */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* fine — app still works online */ });
}

/* ── Library ─────────────────────────────────────────────────── */
let thumbUrls = [];   // object URLs to revoke when the list is rebuilt

function releaseThumbs() {
  for (const u of thumbUrls) URL.revokeObjectURL(u);
  thumbUrls = [];
}

async function libraryRecords() {
  try {
    const all = await dbAll('docs');
    return all.sort((a, b) => (b.openedAt || 0) - (a.openedAt || 0));
  } catch { return []; }
}

async function renderLibrary() {
  const list = $('libList');
  const recs = await libraryRecords();
  releaseThumbs();
  list.replaceChildren();

  if (!recs.length) {
    const blank = document.createElement('div');
    blank.className = 'lib-blank';
    if (await probeStorage()) {
      blank.textContent = 'Documents you open are kept here, along with the page you reached.';
    } else {
      blank.classList.add('lib-note');
      blank.textContent =
        'This browser context is not allowing storage — usually a sandboxed preview ' +
        'or a private window. PDFs will still open, but nothing can be saved. ' +
        'Served from GitHub Pages, the library works normally.';
    }
    list.appendChild(blank);
  }

  for (const rec of recs) {
    const row = document.createElement('div');
    row.className = 'lib-row';
    row.dataset.id = rec.id;
    row.setAttribute('role', 'button');
    row.tabIndex = 0;

    const thumb = document.createElement('div');
    thumb.className = 'lib-thumb';
    if (rec.thumb) {
      const url = URL.createObjectURL(rec.thumb);
      thumbUrls.push(url);
      const img = document.createElement('img');
      img.src = url; img.alt = '';
      thumb.appendChild(img);
    }

    const meta = document.createElement('div');
    meta.className = 'lib-meta';
    const nm = document.createElement('div');
    nm.className = 'lib-name';
    nm.textContent = rec.name || 'Untitled.pdf';
    const sub = document.createElement('div');
    sub.className = 'lib-sub';
    const pos = rec.pageCount
      ? `Page ${rec.page || 1} of ${rec.pageCount}`
      : `Page ${rec.page || 1}`;
    sub.textContent = `${pos} · ${fmtSize(rec.size)}`;
    meta.append(nm, sub);

    if (rec.pageCount > 1) {
      const bar = document.createElement('div');
      bar.className = 'lib-progress';
      const fill = document.createElement('span');
      fill.style.width = `${((rec.page || 1) - 1) / (rec.pageCount - 1) * 100}%`;
      bar.appendChild(fill);
      meta.appendChild(bar);
    }

    const actions = document.createElement('div');
    actions.className = 'lib-actions';
    const del = document.createElement('button');
    del.className = 'btn';
    del.setAttribute('aria-label', `Remove ${rec.name || 'document'}`);
    del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>';
    del.onclick = e => { e.stopPropagation(); armDelete(row, rec); };
    actions.appendChild(del);

    row.append(thumb, meta, actions);
    row.onclick = () => openFromLibrary(rec.id);
    row.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openFromLibrary(rec.id); }
    };
    list.appendChild(row);
  }

  updateUsage();
}

/* Two taps to delete — a stray tap on a trash icon shouldn't cost you a book. */
function armDelete(row, rec) {
  const actions = row.querySelector('.lib-actions');
  actions.replaceChildren();

  const confirm = document.createElement('button');
  confirm.className = 'lib-confirm';
  confirm.textContent = 'Remove';
  confirm.onclick = async e => {
    e.stopPropagation();
    await removeDoc(rec.id);
    renderLibrary();
  };

  const cancel = document.createElement('button');
  cancel.className = 'lib-cancel';
  cancel.textContent = 'Keep';
  cancel.onclick = e => { e.stopPropagation(); renderLibrary(); };

  actions.append(confirm, cancel);
}

async function removeDoc(id) {
  try {
    await dbDelete('files', id);
    await dbDelete('docs', id);
  } catch (err) {
    console.error(err);
    status('Could not remove that document.', true);
    return;
  }
  if (currentId === id) currentId = null;   // stop saving position for it
}

async function updateUsage() {
  const el = $('libUsage');
  if (!(await probeStorage())) { el.textContent = 'Storage unavailable'; return; }
  try {
    const recs = await libraryRecords();
    const bytes = recs.reduce((n, r) => n + (r.size || 0), 0);
    const est = await navigator.storage?.estimate?.().catch(() => null);
    const room = est?.quota ? ` of ${fmtSize(est.quota)} available` : '';
    el.textContent = recs.length
      ? `${recs.length} document${recs.length === 1 ? '' : 's'} · ${fmtSize(bytes)}${room}`
      : 'Nothing saved yet';
  } catch { el.textContent = ''; }
}

async function openFromLibrary(id) {
  try {
    const [rec, file] = await Promise.all([dbGet('docs', id), dbGet('files', id)]);
    if (!file?.blob) {
      status('That file is no longer stored. Removing it.', true, 3500);
      await removeDoc(id);
      renderLibrary();
      return;
    }
    const buf = await file.blob.arrayBuffer();
    await openBuffer(buf, rec?.name || 'Untitled.pdf', { id, fromLibrary: true });
  } catch (err) {
    console.error(err);
    status('Could not open that document.', true);
  }
}

function openLibrary() {
  closePanels();
  closeOutline();
  closeDocInfo();
  $('library').classList.add('open');
  renderLibrary();
}
function closeLibrary() {
  $('library').classList.remove('open');
  releaseThumbs();
}

$('libBtn').onclick   = openLibrary;
$('libClose').onclick = closeLibrary;
$('libOpen').onclick  = () => $('fileInput').click();

/* ── Startup ─────────────────────────────────────────────────── */
(async () => {
  await checkShared();
  if (doc) return;                              // a shared file won the race
  const recs = await libraryRecords();
  if (recs.length) openLibrary();               // launch straight into recents
})();
</script>
</body>
</html>
